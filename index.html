<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Time</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #30465a;
            --blue: #4da3f5;
            --white: #eeeeee;
            --yellow: #f0d66f;
            --orange: #e99372;
            --clock-border: #e5e5e5;
        }

        body {
            margin: 0;
            height: 100vh;

            background: var(--background);

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Consolas, "Courier New", monospace;

            overflow: hidden;

            transition: background 0.4s ease;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            display: flex;
            align-items: center;

            gap: 65px;

            transform: translateY(-10px);
        }


        /* =========================
           CODE
        ========================= */

        .code {
            font-size: 19px;
            line-height: 1.7;

            white-space: nowrap;
        }

        .indent {
            margin-left: 42px;
        }

        .blue {
            color: var(--blue);
        }

        .white {
            color: var(--white);
        }

        .yellow {
            color: var(--yellow);
        }

        .orange {
            color: var(--orange);
        }


        /* =========================
           CLOCK
        ========================= */

        .clock {
            width: 125px;
            height: 125px;

            border: 2px solid var(--clock-border);

            border-radius: 50%;

            position: relative;

            box-shadow:
                0 0 8px rgba(255, 210, 180, 0.8),
                0 0 25px rgba(255, 190, 160, 0.3);

            transition: border-color 0.4s ease;
        }


        /* Clock hands */

        .hand {
            position: absolute;

            left: 50%;
            bottom: 50%;

            transform-origin: bottom center;

            border-radius: 10px;
        }


        .hour-hand {
            width: 4px;
            height: 36px;

            background: var(--white);
        }


        .minute-hand {
            width: 3px;
            height: 49px;

            background: var(--white);
        }


        .second-hand {
            width: 2px;
            height: 55px;

            background: var(--orange);
        }


        /* Center dot */

        .center {
            position: absolute;

            width: 9px;
            height: 9px;

            background: var(--white);

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;
        }


        /* =========================
           DARK / LIGHT TOGGLE
        ========================= */

        .theme-toggle {
            position: fixed;

            top: 20px;
            right: 24px;

            width: 74px;
            height: 37px;

            border: none;

            border-radius: 30px;

            background: #5ca1d8;

            cursor: pointer;

            padding: 3px;

            transition: background 0.4s ease;
        }


        .toggle-circle {
            width: 31px;
            height: 31px;

            border-radius: 50%;

            background: #263b4c;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 17px;

            transition:
                transform 0.35s ease,
                background 0.35s ease;
        }


        /* Light mode */

        .light {
            --background: #e9eef2;
            --blue: #2778bd;
            --white: #26333e;
            --yellow: #9a7610;
            --orange: #c86648;
            --clock-border: #26333e;
        }


        .theme-toggle.light-mode .toggle-circle {
            transform: translateX(37px);

            background: #ffffff;
        }


        /* =========================
           TIMEZONE SELECTOR
        ========================= */

        .clock-wrapper {
            position: relative;
        }

        .clock {
            cursor: pointer;
        }

        .clock:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 6px;
        }

        .timezone-label {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: var(--white);
            opacity: 0.8;
        }

        .timezone-menu {
            position: absolute;
            top: 145px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            width: 190px;
            padding: 10px;
            background: rgba(38, 59, 76, 0.97);
            border: 1px solid rgba(238, 238, 238, 0.2);
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
            z-index: 20;
        }

        .timezone-menu.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .timezone-menu-title {
            color: var(--white);
            font-size: 12px;
            margin: 2px 4px 8px;
            opacity: 0.65;
        }

        .timezone-option {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--white);
            font-family: inherit;
            font-size: 12px;
            text-align: left;
            padding: 9px 8px;
            border-radius: 7px;
            cursor: pointer;
        }

        .timezone-option:hover,
        .timezone-option:focus-visible {
            background: rgba(77, 163, 245, 0.18);
            outline: none;
        }

        .light .timezone-menu {
            background: rgba(255, 255, 255, 0.98);
            border-color: rgba(38, 51, 62, 0.18);
        }

        @media (max-width: 800px) {
            .timezone-menu {
                top: 120px;
            }
        }

        /* =========================
           SMALL SCREENS
        ========================= */

        @media (max-width: 800px) {

            .container {
                gap: 30px;
            }

            .code {
                font-size: 15px;
            }

            .indent {
                margin-left: 25px;
            }

            .clock {
                width: 100px;
                height: 100px;
            }

            .hour-hand {
                height: 29px;
            }

            .minute-hand {
                height: 39px;
            }

            .second-hand {
                height: 44px;
            }
        }

    </style>

<style id="timezone-scroll-fix">
/* Scrollable timezone options */
.timezone-options {
    max-height: 260px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 5px;
    scrollbar-width: thin;
}

.timezone-options::-webkit-scrollbar {
    width: 6px;
}

.timezone-options::-webkit-scrollbar-track {
    background: transparent;
}

.timezone-options::-webkit-scrollbar-thumb {
    background: rgba(150, 150, 150, 0.55);
    border-radius: 10px;
}

.timezone-options::-webkit-scrollbar-thumb:hover {
    background: rgba(150, 150, 150, 0.8);
}
</style>

</head>


<body>


    <!-- =========================
         DARK / LIGHT BUTTON
    ========================= -->

    <button
        class="theme-toggle"
        id="themeToggle"
        title="Change theme"
    >

        <div
            class="toggle-circle"
            id="toggleCircle"
        >
            🌙
        </div>

    </button>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">


        <!-- CODE -->

        <div class="code">

            <div>
                <span class="blue">const</span>
                <span class="white"> currentTime = {</span>
            </div>


            <div class="indent">
                <span class="blue">year:</span>
                <span class="yellow" id="year"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">month:</span>
                <span class="yellow" id="month"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">day:</span>
                <span class="yellow" id="day"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">dayOfWeek:</span>
                <span class="orange" id="dayOfWeek"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">hour:</span>
                <span class="yellow" id="hour"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">minute:</span>
                <span class="yellow" id="minute"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">second:</span>
                <span class="yellow" id="second"></span>
                <span class="white">,</span>
            </div>


            <div class="indent">
                <span class="blue">dayProgress:</span>
                <span class="yellow" id="dayProgress"></span>
            </div>


            <div>
                <span class="white">};</span>
            </div>

        </div>


        <!-- =========================
             ANALOG CLOCK
        ========================= -->

        <div class="clock-wrapper">

            <div
                class="clock"
                id="clock"
                role="button"
                tabindex="0"
                aria-label="Change time zone"
                aria-expanded="false"
            >

            <div
                class="hand hour-hand"
                id="hourHand"
            ></div>

            <div
                class="hand minute-hand"
                id="minuteHand"
            ></div>

            <div
                class="hand second-hand"
                id="secondHand"
            ></div>

            <div class="center"></div>

            </div>

            <div class="timezone-label" id="timezoneLabel">🇳🇵 Kathmandu</div>

            <div class="timezone-menu" id="timezoneMenu" aria-hidden="true">
                <div class="timezone-menu-title">🌍 Time Zone</div>
                <div class="timezone-options">
                    <button class="timezone-option" type="button" data-timezone="Asia/Kathmandu" data-label="🇳🇵 Kathmandu">🇳🇵 Nepal — Kathmandu</button>
                    <button class="timezone-option" type="button" data-timezone="Asia/Tokyo" data-label="🇯🇵 Tokyo">🇯🇵 Japan — Tokyo</button>
                    <button class="timezone-option" type="button" data-timezone="Asia/Seoul" data-label="🇰🇷 Seoul">🇰🇷 South Korea — Seoul</button>
                    <button class="timezone-option" type="button" data-timezone="Asia/Shanghai" data-label="🇨🇳 Shanghai">🇨🇳 China — Shanghai</button>
                    <button class="timezone-option" type="button" data-timezone="Europe/London" data-label="🇬🇧 London">🇬🇧 United Kingdom — London</button>
                    <button class="timezone-option" type="button" data-timezone="Europe/Paris" data-label="🇫🇷 Paris">🇫🇷 France — Paris</button>
                    <button class="timezone-option" type="button" data-timezone="America/New_York" data-label="🇺🇸 New York">🇺🇸 USA — New York</button>
                    <button class="timezone-option" type="button" data-timezone="America/Los_Angeles" data-label="🇺🇸 Los Angeles">🇺🇸 USA — Los Angeles</button>
                    <button class="timezone-option" type="button" data-timezone="Australia/Sydney" data-label="🇦🇺 Sydney">🇦🇺 Australia — Sydney</button>
                </div>
            </div>

        </div>

    </div>



    <script>

        /* =========================
           LIVE TIME
        ========================= */

        let selectedTimeZone = "Asia/Kathmandu";


        function updateTime() {

            const now = new Date();

            const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: selectedTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                weekday: "long",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            }).formatToParts(now);

            const getPart = (type) =>
                parts.find(part => part.type === type)?.value || "00";

            const year = Number(getPart("year"));
            const month = getPart("month");
            const day = getPart("day");
            const dayOfWeek = getPart("weekday");
            const hour = Number(getPart("hour"));
            const minute = Number(getPart("minute"));
            const second = Number(getPart("second"));


            // Display

            document.getElementById("year")
                .textContent = year;


            document.getElementById("month")
                .textContent = month;


            document.getElementById("day")
                .textContent = day;


            document.getElementById("dayOfWeek")
                .textContent =
                `"${dayOfWeek}"`;


            document.getElementById("hour")
                .textContent =
                String(hour).padStart(2, "0");


            document.getElementById("minute")
                .textContent =
                String(minute).padStart(2, "0");


            document.getElementById("second")
                .textContent =
                String(second).padStart(2, "0");


            /* =========================
               DAY PROGRESS
            ========================= */

            const secondsPassed =
                hour * 3600 +
                minute * 60 +
                second;


            const totalSeconds =
                24 * 60 * 60;


            const progress =
                secondsPassed /
                totalSeconds *
                100;


            document.getElementById("dayProgress")
                .textContent =
                progress.toFixed(2) + "%";


            /* =========================
               ANALOG CLOCK
            ========================= */

            const milliseconds =
                now.getMilliseconds();


            const seconds =
                second +
                milliseconds / 1000;


            const minutes =
                minute +
                seconds / 60;


            const hours =
                (hour % 12) +
                minutes / 60;


            const secondAngle =
                seconds * 6;


            const minuteAngle =
                minutes * 6;


            const hourAngle =
                hours * 30;


            document.getElementById("secondHand")
                .style.transform =
                `translateX(-50%)
                 rotate(${secondAngle}deg)`;


            document.getElementById("minuteHand")
                .style.transform =
                `translateX(-50%)
                 rotate(${minuteAngle}deg)`;


            document.getElementById("hourHand")
                .style.transform =
                `translateX(-50%)
                 rotate(${hourAngle}deg)`;
        }


        updateTime();

        setInterval(updateTime, 50);



        /* =========================
           TIMEZONE SELECTOR
        ========================= */

        const clock = document.getElementById("clock");
        const timezoneMenu = document.getElementById("timezoneMenu");
        const timezoneLabel = document.getElementById("timezoneLabel");
        const timezoneOptions = document.querySelectorAll(".timezone-option");

        function toggleTimezoneMenu(force) {
            const shouldOpen = typeof force === "boolean"
                ? force
                : !timezoneMenu.classList.contains("open");

            timezoneMenu.classList.toggle("open", shouldOpen);
            timezoneMenu.setAttribute("aria-hidden", String(!shouldOpen));
            clock.setAttribute("aria-expanded", String(shouldOpen));
        }

        clock.addEventListener("click", () => toggleTimezoneMenu());

        clock.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleTimezoneMenu();
            }
            if (event.key === "Escape") {
                toggleTimezoneMenu(false);
            }
        });

        timezoneOptions.forEach(option => {
            option.addEventListener("click", (event) => {
                event.stopPropagation();
                selectedTimeZone = option.dataset.timezone;
                timezoneLabel.textContent = option.dataset.label;
                toggleTimezoneMenu(false);
                updateTime();
            });
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".clock-wrapper")) {
                toggleTimezoneMenu(false);
            }
        });


        /* =========================
           DARK / LIGHT MODE
        ========================= */

        const themeToggle =
            document.getElementById(
                "themeToggle"
            );


        const toggleCircle =
            document.getElementById(
                "toggleCircle"
            );


        themeToggle.addEventListener(
            "click",
            function () {

                document.body.classList.toggle(
                    "light"
                );


                themeToggle.classList.toggle(
                    "light-mode"
                );


                if (
                    document.body.classList.contains(
                        "light"
                    )
                ) {

                    toggleCircle.textContent =
                        "☀️";

                } else {

                    toggleCircle.textContent =
                        "🌙";

                }

            }
        );

    </script>

</body>
</html>
